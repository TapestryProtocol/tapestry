server {
    listen 80;
    server_name localhost;

    # Allow large request bodies (WoT score uploads can be 50MB+)
    client_max_body_size 100m;

    # Firmware install — long-running, needs extended timeout
    location /api/firmware/install {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778/api/firmware/install;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Scan count endpoint — can take minutes on large databases
    location /api/strfry/scan/count {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778/api/strfry/scan/count;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Streaming scan endpoint — long-lived, no buffering
    location /api/strfry/scan/stream {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778/api/strfry/scan/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Brainstorm Control Panel at root
    # Backup and restore (ADR graph-operations-foundation/0002 Decision 13): uploads and downloads of a whole backup,
    # streamed both ways, and backups or restores that take minutes. Keep X-Forwarded-For: the app trusts a loopback
    # request that lacks it as the local operator (src/middleware/auth.js), so without it every visitor would be trusted.
    location /api/tapestry/lifecycle/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Only the upload takes a backup-sized body (up to 9g), passed to the app as it arrives; every other lifecycle
    # route keeps the server's 100m (ADR graph-operations-foundation/0002 Amendment 1, A4).
    location = /api/tapestry/lifecycle/upload-backup {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        client_max_body_size 9g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7778/;
        proxy_http_version 1.1;
        include /etc/nginx/mime.types;
    }

    # NIP-50 relay proxy at /relay — routes search REQs to Meilisearch,
    # passes all other traffic through to strfry transparently.
    # Also handles NIP-11 (Accept: application/nostr+json).
    location /relay {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7780/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Neo4j Browser
    location /neo4j/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7474/;
        proxy_http_version 1.1;
    }

    # Neo4j Browser assets (needs direct proxy for relative paths)
    location /browser/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7474/browser/;
        proxy_http_version 1.1;
    }

    # Neo4j Bolt WebSocket proxy
    location /bolt {
        proxy_pass http://127.0.0.1:7687;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
