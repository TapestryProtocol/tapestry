name: Test

# The first CI test gate (story test-hermeticity-ci #4, ADR 0001). Runs the
# same stack-free suite every contributor runs, on every PR to a long-lived
# branch — a pre-merge gate that never races the push-triggered deploy
# workflows. No retries anywhere: the first run's exit code is the verdict, so
# a red run is signal. OPERATIONS.md § "CI test gate" names the stack-free flakes
# found so far, each with a ledger row and a fix or a move out of the gate, and
# the failed runs that were run again by hand against this rule.

on:
  pull_request:
    branches: [staging, main]

# A newer push to the same PR supersedes the older in-flight run.
concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The gate only reads the repository (OPERATIONS.md, "Workflow rules").
permissions:
  contents: read

jobs:
  stack-free:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # @scarf/scarf's postinstall phones home; suppress it. Install scripts
      # stay ENABLED overall — lmdb/msgpackr prebuild downloads need them.
      SCARF_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so harness-lint L9/L10 (git-log-based) stay live in CI.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'   # production Dockerfile parity (nodesource 22.x)
          cache: npm
      - run: npm ci
      # TEMPORARY (test-gate-speed #1, test plan V1): today's engine, as on staging, over this same tree on this same
      # runner, so its time can be compared with the step after it. The next push removes this step.
      - run: |
          mkdir -p "$RUNNER_TEMP/oldgate"
          git show origin/staging:test/helpers/gateRecord.js | sed "s|path.resolve(__dirname, '..', '..')|'$PWD'|" > "$RUNNER_TEMP/oldgate/gateRecord.js"
          git show origin/staging:test/helpers/gateRunner.js | sed "s|path.resolve(__dirname, '..')|'$PWD/test'|" > "$RUNNER_TEMP/oldgate/gateRunner.js"
          node -e "process.env.BRAINSTORM_RELAY_URL='wss://test-relay.com'; process.env.BRAINSTORM_RELAY_PUBKEY='test-pubkey'; require(process.env.RUNNER_TEMP + '/oldgate/gateRunner').runGate({ suites: require('./test/registry').suites, label: 'old-engine' })" || echo "the old engine's run exited $?"
      - run: npm test
