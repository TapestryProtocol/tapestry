name: Test

# The first CI test gate (story test-hermeticity-ci #4, ADR 0001). Runs the
# same stack-free suite every contributor runs, on every PR to a long-lived
# branch — a pre-merge gate that never races the push-triggered deploy
# workflows. No retries anywhere: the first run's exit code is the verdict, so
# a red run is signal. OPERATIONS.md § "CI test gate" names the stack-free flakes
# found so far, each with a ledger row and a fix or a move out of the gate, and
# the failed runs that were run again by hand against this rule.

on:
  pull_request:
    branches: [staging, main]

# A newer push to the same PR supersedes the older in-flight run.
concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The gate only reads the repository (OPERATIONS.md, "Workflow rules").
permissions:
  contents: read

jobs:
  # The gate in two parts, each on a runner of its own; every suite runs in exactly one part (story test-gate-speed #1,
  # ADR test-gate-speed/0001 Amendment 3). A part runs its suites side by side, as many at a time as its runner has
  # CPUs. Both parts run to the end, so one part's failure never hides what the other finds.
  stack-free-part:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      # @scarf/scarf's postinstall phones home; suppress it. Install scripts
      # stay ENABLED overall — lmdb/msgpackr prebuild downloads need them.
      SCARF_ANALYTICS: "false"
      # Which part of the gate this runner runs. Unset, as on a contributor's machine, npm test runs the whole gate.
      GATE_PART: ${{ matrix.part }}/2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so harness-lint L9/L10 (git-log-based) stay live in CI.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'   # production Dockerfile parity (nodesource 22.x)
          cache: npm
      - run: npm ci
      - run: npm test

  # The check main's ruleset requires by name, and it carries the parts' verdict. It runs even when a part failed or
  # was cancelled, since a skipped required check would read as passing, and it fails unless every part succeeded.
  stack-free:
    needs: stack-free-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "The parts of the stack-free gate: ${{ needs.stack-free-part.result }}"
          test "${{ needs.stack-free-part.result }}" = "success"
