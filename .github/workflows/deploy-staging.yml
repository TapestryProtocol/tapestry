name: Deploy to Staging

on:
  push:
    branches: [staging]

# Serialize deploys: two rapid merges once ran `docker compose up -d --build`
# concurrently on the droplet and left the app container in Created (never
# started) — staging 502'd until a manual re-up (OPEN.md row 183, 2026-08-27).
# The newest queued push wins; an in-flight deploy is never cancelled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# The job only opens an SSH session, so its token is given nothing (OPERATIONS.md, "Workflow rules").
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Where this server's deploy secrets belong (OPERATIONS.md, "Workflow rules").
    environment: staging
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        timeout-minutes: 60
        with:
          host: ${{ secrets.DEPLOY_HOST_STAGING }}
          username: ${{ secrets.DEPLOY_USER_STAGING }}
          key: ${{ secrets.DEPLOY_SSH_KEY_STAGING }}
          command_timeout: 50m
          script: |
            cd /opt/tapestry
            git checkout -- docker-compose.yml 2>/dev/null
            git checkout staging 2>/dev/null || git checkout -b staging origin/staging
            git pull origin staging
            # Staging droplet uses host nginx on port 80, so Docker must bind to 8080 on localhost only
            sed -i 's/"80:80"/"127.0.0.1:8080:80"/' docker-compose.yml
            docker compose up -d --build
            docker image prune -f
