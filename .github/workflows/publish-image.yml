name: Publish brain images

# Builds the images brains run, then moves every brain on tapestry.ninja onto them, one at a time. See deploy/RUNBOOK.md.
# A roll does not reload Caddy, so a Caddyfile change needs the restart the runbook gives.
# A push to main runs it. It can also be run by hand on main, or on staging to try staging on the brains before it reaches
# main; the next push to main moves them back onto main's build. A run also leaves the droplet's checkout on the branch it
# ran from, so the launcher and Caddy follow that branch's deploy/ until the next run.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Later pushes wait their turn. Stopping a roll partway would leave brains on two images for no reason.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit id
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push the Tapestry image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nousclawds4/tapestry:dogfood
            ghcr.io/nousclawds4/tapestry:sha-${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=tapestry
          cache-to: type=gha,mode=max,scope=tapestry

      - name: Build and push the search image
        uses: docker/build-push-action@v6
        with:
          context: ./nostr-search
          push: true
          tags: |
            ghcr.io/nousclawds4/tapestry-nostr-search:dogfood
            ghcr.io/nousclawds4/tapestry-nostr-search:sha-${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=tapestry-nostr-search
          cache-to: type=gha,mode=max,scope=tapestry-nostr-search

      - name: Roll the brains
        uses: appleboy/ssh-action@v1
        timeout-minutes: 60
        env:
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST_NINJA }}
          username: ${{ secrets.DEPLOY_USER_NINJA }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NINJA }}
          envs: REF
          command_timeout: 55m
          script: |
            set -euo pipefail
            cd /opt/tapestry
            git fetch origin "$REF"
            git checkout "$REF"
            git pull --ff-only origin "$REF"
            docker compose -f deploy/edge/docker-compose.yml up -d --build
            # A rebuilt launcher takes a moment to answer, and the roll fails if it comes too soon.
            for i in $(seq 1 30); do
              docker exec edge-launcher node cli.js list >/dev/null 2>&1 && break
              sleep 2
            done
            docker exec edge-launcher node cli.js roll dogfood
            # Each roll leaves the old image behind, and a full disk stops every brain.
            docker image prune -f
