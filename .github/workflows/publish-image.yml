name: Publish brain images

# Builds the images brains run, then moves every brain on tapestry.ninja onto them, one at a time. See deploy/RUNBOOK.md.
# A roll does not reload Caddy, so a Caddyfile change needs the restart the runbook gives.
# The brains follow staging (brains-launcher ADR 0001, amendments 1 and 2): a push to staging runs it only when the push
# changes something a brain runs or serves, the paths below. Docs, tests, records and tooling don't roll them. A push to
# main doesn't, so promoting staging never moves the brains back onto an older build. It can also be run by hand on
# staging, or on main to try main's build until the next staging push. A run leaves the droplet's checkout on the branch
# it ran from, so the launcher and Caddy follow that branch's deploy/ until the next run.
# A new top-level folder the image uses goes in the list below; test W1c fails until every top-level path is sorted.
# GitHub reads only a push's first 300 changed files here, so after a bigger push, run it by hand.

on:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "bin/**"
      - "lib/**"
      - "config/**"
      - "customers/**"
      - "public/**"
      - "setup/**"
      - "firmware/**"
      - "plugins/**"
      - "tools/**"
      - "ui/**"
      - "docker/**"
      - "patches/**"
      - "nip50-proxy/**"
      - "nostr-search/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-image.yml"
      # Notes and tests inside those folders don't change what a brain does.
      - "!**/*.md"
      - "!**/*.test.*"
      # The one Markdown file a brain serves, at /information-for-agents.md.
      - "docs/information-for-agents.md"
  workflow_dispatch:

# Later pushes wait their turn. Stopping a roll partway would leave brains on two images for no reason. While a roll runs,
# GitHub keeps only the newest waiting run, so a burst of pushes ends in one roll onto the last of them.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Where the ninja server's deploy secrets belong, which the last step reads (OPERATIONS.md §17).
    environment: ninja
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit id
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push the Tapestry image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tapestryprotocol/tapestry:dogfood
            ghcr.io/tapestryprotocol/tapestry:sha-${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=tapestry
          cache-to: type=gha,mode=max,scope=tapestry

      - name: Build and push the search image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./nostr-search
          push: true
          tags: |
            ghcr.io/tapestryprotocol/tapestry-nostr-search:dogfood
            ghcr.io/tapestryprotocol/tapestry-nostr-search:sha-${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=tapestry-nostr-search
          cache-to: type=gha,mode=max,scope=tapestry-nostr-search

      - name: Roll the brains
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        timeout-minutes: 60
        env:
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST_NINJA }}
          username: ${{ secrets.DEPLOY_USER_NINJA }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NINJA }}
          envs: REF
          command_timeout: 55m
          script: |
            set -euo pipefail
            cd /opt/tapestry
            git fetch origin "$REF"
            git checkout "$REF"
            git pull --ff-only origin "$REF"
            docker compose -f deploy/edge/docker-compose.yml up -d --build
            # A rebuilt launcher takes a moment to answer, and the roll fails if it comes too soon.
            for i in $(seq 1 30); do
              docker exec edge-launcher node cli.js list >/dev/null 2>&1 && break
              sleep 2
            done
            docker exec edge-launcher node cli.js roll dogfood
            # Each roll leaves the old image behind, and a full disk stops every brain.
            docker image prune -f
