name: Deploy to Magic Carpet

on:
  push:
    branches: [feature-magic-carpet]

# The job only opens an SSH session, so its token is given nothing (OPERATIONS.md, "Workflow rules").
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Where this server's deploy secrets belong (OPERATIONS.md, "Workflow rules").
    environment: magic-carpet
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        timeout-minutes: 60
        with:
          host: ${{ secrets.DEPLOY_HOST_MAGIC_CARPET }}
          username: ${{ secrets.DEPLOY_USER_MAGIC_CARPET }}
          key: ${{ secrets.DEPLOY_SSH_KEY_MAGIC_CARPET }}
          command_timeout: 50m
          script: |
            # Fail fast: any non-zero exit aborts the script. Without this,
            # a docker-build failure was silently followed by `docker image
            # prune` (exit 0), and the SSH action reported success while the
            # old container kept running (discovered on the tags droplet,
            # 2026-05-27 — see deploy-tags.yml).
            set -euo pipefail
            cd /opt/tapestry
            git checkout -- docker-compose.yml 2>/dev/null || true
            git checkout feature-magic-carpet 2>/dev/null || git checkout -b feature-magic-carpet origin/feature-magic-carpet
            git pull origin feature-magic-carpet
            # Magic Carpet droplet uses host nginx on port 80, so Docker must bind to 8080 on localhost only
            sed -i 's/"80:80"/"127.0.0.1:8080:80"/' docker-compose.yml
            # The first deploy of each ISO week (from Monday 00:00 UTC) also brings the image's Ubuntu
            # packages up to date (ADR container-apt-refresh/0001, OPERATIONS.md §3).
            export PACKAGES_REFRESH="$(date -u +%G-W%V)"
            docker compose up -d --build
            docker image prune -f
