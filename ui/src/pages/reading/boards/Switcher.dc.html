<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jump to anything</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button,input{font-family:inherit}</style>
</helmet>
<span style="display: inline-flex">
  <button onClick="{{show}}" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 8px; cursor: pointer; border: 1px solid #CFCDC6; background: #FFFFFF; color: #3A3935">Jump to anything<span style="font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #F1EFE9; color: #5B5A55">{{keyHint}}</span></button>
  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <div onClick="{{hide}}" style="position: fixed; inset: 0; z-index: 80; background: rgba(28,28,26,0.32); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 16px 16px 16px; box-sizing: border-box">
      <div onClick="{{stop}}" role="dialog" aria-label="Jump to anything" style="width: 100%; max-width: 640px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,0.22); overflow: hidden; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #1C1C1A">
        <input ref="{{inputRef}}" value="{{q}}" onChange="{{type}}" onKeyDown="{{key}}" placeholder="Type a few letters of any title…" aria-label="Search titles" style="font-size: 17px; padding: 16px 18px; border: none; border-bottom: 1px solid #EDEBE4; outline: none; color: #1C1C1A">
        <span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5A55; padding: 10px 18px 4px 18px">{{listTitle}}</span>
        <div style="display: flex; flex-direction: column; max-height: 52vh; overflow-y: auto; padding: 0 8px 8px 8px">
          <sc-for list="{{results}}" as="r" hint-placeholder-count="6">
            <button onClick="{{r.go}}" onMouseEnter="{{r.hover}}" style="{{r.style}}"><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1"><span style="font-size: 14px; line-height: 1.35">{{r.name}}</span><span style="font-size: 12px; color: #5B5A55">{{r.where}}</span></span><span style="{{r.tagStyle}}">{{r.tag}}</span></button>
          </sc-for>
          <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 12px 10px; font-size: 14px; color: #5B5A55">Nothing has that in its title or text.</p></sc-if>
        </div>
        <span style="font-size: 11px; color: #5B5A55; padding: 8px 18px; border-top: 1px solid #EDEBE4; background: #FBFAF7">↑ ↓ to move · Enter to go · Esc to close</span>
      </div>
    </div>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":220,"height":60},"onGo":{"editor":null}}'>
class Component extends DCLogic {
  // props: onGo(id), called with the chosen node's id. Opens from its button or Cmd/Ctrl-K anywhere on the board.
  constructor(props) {
    super(props);
    this.state = { g: null, open: false, q: '', sel: 0 };
    this.inputRef = (el) => { if (el && document.activeElement !== el) el.focus(); };
    this.onKey = (e) => { if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); this.setState({ open: !this.state.open, q: '', sel: 0 }); } };
  }

  componentDidMount() {
    window.addEventListener('keydown', this.onKey);
    if (window.Brain) { this._off = Brain.watch(() => this.setState({ g: this.prep(Brain.doc()) })); return; }
    fetch('/_blob/dcde019c6a74631fb618ff1c99ab7340').then((r) => r.json()).then((d) => this.setState({ g: this.prep(d) })).catch(() => {});
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); if (this._off) this._off(); }
  prep(d) {
    const N = {}, mem = {};
    d.nodes.forEach((n) => { N[n.id] = n; n._low = String(n.name || '').toLowerCase(); n._text = String((n.fields && (n.fields.claim || n.fields.stance || n.fields.quote)) || n.description || '').toLowerCase(); });
    d.nodes.forEach((n) => n.kinds.concat(n.sets).forEach((x) => { mem[x] = (mem[x] || 0) + 1; }));
    return { d, N, mem };
  }
  // live: the instance's own title search, a moment after typing stops
  search(q) {
    clearTimeout(this._t);
    if (!window.Brain || !q.trim()) return;
    this._t = setTimeout(() => Brain.api('search', { q: q.trim(), limit: 14 })
      .then((d) => { if (this.state.q === q) this.setState({ hits: d.results, hitsFor: q }); }).catch(() => {}), 180);
  }

  kindOf(g, n) {
    if (n.role === 'concept') return 'concept';
    if (n.role === 'set') return 'Set';
    const ks = n.kinds.filter((k) => g.N[k]).sort((a, b) => (g.mem[a] || 0) - (g.mem[b] || 0));
    return ks.length ? g.N[ks[0]].name : 'element';
  }

  notable(n) {
    const a = n.answers || {};
    return (a.settled === false ? 6 : 0) + (a.history || 0) * 1.5 + (a.evidence_for || 0) + (a.evidence_against || 0) * 2 + ((a.used_by_scopes || []).length >= 2 ? 8 : 0) + (n.provenance !== 'ours' ? 5 : 0);
  }

  // every word must appear in the title (best at its start) or, failing that, in the text
  matches(g, q) {
    if (window.Brain && q.trim() && this.state.hitsFor === q) return (this.state.hits || []).map((id) => g.N[id]).filter(Boolean);
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return g.d.nodes.filter((n) => n.part !== 'structure').sort((a, b) => this.notable(b) - this.notable(a)).slice(0, 10);
    const scored = [];
    g.d.nodes.forEach((n) => {
      let s = 0;
      for (const w of words) {
        const i = n._low.indexOf(w);
        if (i === 0) s += 4; else if (i > 0) s += n._low[i - 1] === ' ' ? 3 : 1.5; else if (n._text.indexOf(w) >= 0) s += 0.5; else return;
      }
      scored.push({ n, s: s - n._low.length / 400 });
    });
    return scored.sort((a, b) => b.s - a.s).slice(0, 14).map((x) => x.n);
  }

  // a scope key (project:<handle>, concept:<handle>) by its name; on the canvas a part is already a name
  scopeLabel(part) {
    const sc = window.Brain && (Brain.state.scopes || []).find((x) => x.key === part);
    if (sc) return sc.label;
    if (part === 'structure') return 'structure';
    return String(part || '').replace(/^\w+:\d+:[0-9a-f]{64}:/, '');
  }

  go(id) { this.setState({ open: false, q: '', sel: 0 }); if (this.props.onGo) this.props.onGo(id); }

  renderVals() {
    const s = this.state, g = s.g;
    const mac = typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || '');
    const base = { keyHint: mac ? '⌘K' : 'Ctrl K', open: s.open, q: s.q, inputRef: this.inputRef, listTitle: '', results: [], none: false,
      show: () => this.setState({ open: true, q: '', sel: 0 }), hide: () => this.setState({ open: false }), stop: (e) => e.stopPropagation(),
      type: (e) => { const q = e.target.value; this.setState({ q, sel: 0 }); this.search(q); }, key: () => {} };
    if (!g || !s.open) return base;
    const list = this.matches(g, s.q), sel = Math.min(s.sel, Math.max(list.length - 1, 0));
    base.listTitle = s.q.trim() ? list.length + ' match' + (list.length === 1 ? '' : 'es') + (window.Brain && s.hitsFor !== s.q ? ' so far; searching the whole instance…' : '') : (window.Brain ? 'Most notable of what is loaded' : 'Most notable');
    base.none = !list.length;
    base.key = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ sel: Math.min(sel + 1, list.length - 1) }); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sel: Math.max(sel - 1, 0) }); }
      else if (e.key === 'Enter') { e.preventDefault(); if (list[sel]) this.go(list[sel].id); }
      else if (e.key === 'Escape') { e.preventDefault(); this.setState({ open: false }); }
    };
    base.results = list.map((n, i) => {
      const far = n.provenance !== 'ours';
      return { name: n.name.length > 110 ? n.name.slice(0, 108) + '…' : n.name, where: this.kindOf(g, n) + ' · ' + this.scopeLabel(n.part), tag: far ? n.provenance : '',
        tagStyle: 'flex: none; font-size: 11px; font-weight: 600; color: #5B35B8',
        go: () => this.go(n.id), hover: () => { if (this.state.sel !== i) this.setState({ sel: i }); },
        style: 'flex-shrink: 0; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 8px 10px; min-height: 44px; border: none; border-radius: 8px; cursor: pointer; color: #1C1C1A; background: ' + (i === sel ? '#EEF2FB' : 'transparent') };
    });
    return base;
  }
}
</script>
</body>
</html>
